name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (ruff + unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Unit tests
        run: python -m pytest tests/test_unit.py -q

  backend-integration:
    name: Backend (API tests, needs Supabase)
    runs-on: ubuntu-latest
    if: ${{ vars.RUN_API_TESTS == 'true' }}
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: API tests
        if: ${{ env.SUPABASE_URL != '' && env.SUPABASE_KEY != '' && env.DATABASE_URL != '' }}
        run: python -m pytest tests/test_api.py -q
      - name: Skip notice
        if: ${{ env.SUPABASE_URL == '' || env.SUPABASE_KEY == '' || env.DATABASE_URL == '' }}
        run: echo "Skipping API tests - set SUPABASE_URL, SUPABASE_KEY, and DATABASE_URL repo secrets"

  frontend:
    name: Frontend (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test