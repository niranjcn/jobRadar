AF_initDataCallback({key: 'ds:1', hash: '2', data:[[["92162448210961094", "Software Engineer, Full Stack, Pixel Weather", "https://www.google.com/about/careers/applications/signin?jobId=CiUAL2FckYTigYa4qi44OqbQG_VW3_pHScztUZ4XteBsa8Di5ldyEjsA1Ny_i-FRT38118l3IQqeZyUOVffbWpcOHj7BLR8olL5nHMK9d_P-RThk3vB-VimEp2FxD50_E9woQw%3D%3D_V2&loc=CN&title=Software+Engineer", [null, "<ul>\n<li>Collaborate with direct, cross-functional teams and partner teams to define, design, implement, test and ship new features and products.</li>\n<li>Build weather experience potentially including Android apps, platform, server side changes to deliver key road map.</li>\n<li>Own the full software development life cycle from conception to delivery.</li>\n<li>Build mission critical user facing product components to ensure high quality and timely launch, making direct impact to Pixel's Objectives and Key Results (OKRs).</li>\n<li>Leverage advanced natural language processing to pioneer a groundbreaking weather experience for Pixel users.</li>\n</ul>"], [null, "<h3>Minimum qualifications:</h3><ul>\n<li>Bachelor\u2019s degree or equivalent practical experience.<br></li>\n<li>2 years of experience with software development in one or more programming languages (e.g. Java, Kotlin), or 2 years of experience with an advanced degree.</li>\n</ul><br><h3>Preferred qualifications:</h3><ul>\n<li>2 years of engineering experience building large-scale user facing products.</li>\n<li>2 years of engineering experience building and maintaining enterprise scale services.</li>\n<li>2 years of experience in using Java and Kotlin.</li>\n<li>1 year of experience in Android development.</li>\n</ul>"], "projects/gweb-careers-proto/tenants/60107626-8e00-0000-0000-0071646e0806/companies/ebbbf0d1-8121-483c-8f99-ee92597591fc", null, "Google", "en-US", [["Shanghai, China", ["Shanghai, China"], "Shanghai", null, "Shanghai", "CN"]], [null, "<p>Google's software engineers develop the next-generation technologies that change how billions of users connect, explore, and interact with information and one another. Our products need to handle information at massive scale, and extend well beyond web search. We're looking for engineers who bring fresh ideas from all areas, including information retrieval, distributed computing, large-scale system design, networking and data storage, security, natural language processing, UI design and mobile; the list goes on and is growing every day. As a software engineer, you will work on a specific project critical to Google\u2019s needs with opportunities to switch teams and projects as you and our fast-paced business grow and evolve. We need our engineers to be versatile, display leadership qualities and be enthusiastic to take on new problems across the full-stack as we continue to push technology forward.</p>\n<p>The Pixel Weather team is redefining intelligent computing on mobile. We are moving past static, single-source forecasting to build a proactive weather ecosystem tailored to the individual. We leverage proprietary on-device integrations to contextually adapt the weather to our users habits, schedules, and environments.<br><br>Pixel Weather is not just a weather app with simple data source, but also a truly integrated and intuitive tool that enhances a user's daily life, helping them make smarter, more prepared decisions. </p><p>The Google Pixel team focuses on designing and delivering the world's most helpful mobile experience. The team works on shaping the future of Pixel devices and services through some of the most advanced designs, techniques, products, and experiences in consumer electronics. This includes bringing together the best of Google\u2019s software and hardware to build global smartphones and create transformative experiences for users across the world.</p>"], [2, 3, 4], [1786382013, 841000000], [1786382013, 841000000], [1786382013, 909000000], [null, ""], null, null, [null, ""], [null, "<ul>\n<li>Bachelor\u2019s degree or equivalent practical experience.<br></li>\n<li>2 years of experience with software development in one or more programming languages (e.g. Java, Kotlin), or 2 years of experience with an advanced degree.</li>\n</ul>"], 2], ["116059745030152902", "Software Engineer III", "https://www.google.com/about/careers/applications/signin?jobId=CiUAL2FckSbqXoFX1z7FP3uJy5av8YzJo616KO1QUYIjJd9DlpxGEjsA1Ny_i8ObMyPACFNb_jGxVeygf4TfbHCQoyzsYnRhHrGo3jDNUKX-wDibVrUiuObYWHUSDHVJz-BxnQ%3D%3D_V2&loc=US&title=Software+Engineer+III", [null, "<ul>\n<li>Write product or system development code.</li>\n<li>Participate in, or lead, design reviews with peers and stakeholders to decide amongst available technologies.</li>\n<li>Review code developed by other developers and provide feedback to ensure best practices (e.g., style guidelines, checking code in, accuracy, testability, and efficiency).</li>\n<li>Contribute to existing documentation or educational content and adapt content based on product/program updates and user feedback.</li>\n<li>Triage product or system issues and debug/track/resolve by analyzing the sources of issues and the impact on hardware, network, or service operations and quality.</li>\n</ul>"], [null, "<h3>Minimum qualifications:</h3><ul>\n<li>Bachelor's degree or equivalent practical experience.</li>\n<li>2 years of experience programming in C++, Python, or Java.</li>\n</ul><br><h3>Preferred qualifications:</h3><ul>\n<li>Master's degree or PhD in Computer Science or related technical fields.</li>\n<li>2 years of experience with data structures and algorithms in either an academic or industry setting.</li>\n<li>2 years of experience with performance, large-scale systems data analysis, visualization tools, or debugging.</li>\n<li>Experience developing accessible technologies.</li>\n<li>Proficiency in code and system health, diagnosis and resolution, and software test engineering.</li>\n</ul>"], "projects/gweb-careers-proto/tenants/60107626-8e00-0000-0000-0071646e0806/companies/ebbbf0d1-8121-483c-8f99-ee92597591fc", null, "Google", "en-US", [["Pittsburgh, PA, USA", ["Pittsburgh, PA, USA"], "Pittsburgh", null, "PA", "US"]], [null, "<p>Google's software engineers develop the next-generation technologies that change how billions of users connect, explore, and interact with information and one another. Our products need to handle information at massive scale, and extend well beyond web search. We're looking for engineers who bring fresh ideas from all areas, including information retrieval, distributed computing, large-scale system design, networking and data storage, security, artificial intelligence, natural language processing, UI design and mobile; the list goes on and is growing every day. As a software engineer, you will work on a specific project critical to Google\u2019s needs with opportunities to switch teams and projects as you and our fast-paced business grow and evolve. We need our engineers to be versatile, display leadership qualities and be enthusiastic to take on new problems across the full-stack as we continue to push technology forward.</p>\n<p>With your technical expertise, you will manage project priorities, deadlines, and deliverables. You will design, develop, test, deploy, maintain, and enhance software solutions.</p><p><b></b></p>Individual pay is determined by factors including job-related skills, experience, and relevant education or training.  <br><br>US: $147000 - $210000 (USD) + 15% bonus target + equity + benefits<br><br>Learn more about <a href=\"https://www.google.com/about/careers/applications/benefits/\" target=\"_blank\">benefits at Google</a>."], [4, 3, 2], [1786972876, 297000000], [1786972876, 297000000], [1786972876, 334000000], [null, ""], null, null, [null, ""], [null, "<ul>\n<li>Bachelor's degree or equivalent practical experience.</li>\n<li>2 years of experience programming in C++, Python, or Java.</li>\n</ul>"], 2], ["110588575170339526", "Senior Software Engineer", "https://www.google.com/about/careers/applications/signin?jobId=CiUAL2FckdomNpfHZuwU-Rg1-5qCBM5nRmfiQirFInLQUeB3bfarEjsA1Ny_iyE6xD8HUyHeZ5gkRfKyTMNz5E3mhe2tG-LehY_Ca-iHlXhYWCgjDWPnURFRnXC7-vTWfG6T7A%3D%3D_V2&loc=US&title=Senior+Software+Engineer", [null, "<ul>\n<li>Write and test product or system development code.</li>\n<li>Participate in, or lead, design reviews with peers and stakeholders to decide amongst available technologies.</li>\n<li>Review code developed by other developers and provide feedback to ensure best practices (e.g., style guidelines, checking code in, accuracy, testability, and efficiency).</li>\n<li>Contribute to existing documentation or educational content and adapt content based on product/program updates and user feedback.</li>\n<li>Triage product or system issues and debug/track/resolve by analyzing the sources of issues and the impact on hardware, network, or service operations and quality.</li>\n</ul>"], [null, "<h3>Minimum qualifications:</h3><ul>\n<li>Bachelor's degree or equivalent practical experience.</li>\n<li>5 years of experience in object-oriented programming with Java, C++, or Python.</li>\n<li>3 years of experience testing, maintaining, or launching software products.</li>\n<li>1 year of experience with software design and architecture.</li>\n</ul><br><h3>Preferred qualifications:</h3><ul>\n<li>Master's degree or PhD in Computer Science or related technical field.</li>\n<li>5 years of experience with data structures and algorithms.</li>\n<li>1 year of experience in a technical leadership role.</li>\n<li>Experience developing accessible technologies.</li>\n</ul>"], "projects/gweb-careers-proto/tenants/60107626-8e00-0000-0000-0071646e0806/companies/ebbbf0d1-8121-483c-8f99-ee92597591fc", null, "Google", "en-US", [["Cambridge, MA, USA", ["Cambridge, MA, USA"], "Cambridge", null, "MA", "US"]], [null, "<p>Google's software engineers develop the next-generation technologies that change how billions of users connect, explore, and interact with information and one another. Our products need to handle information at massive scale, and extend well beyond web search. We're looking for engineers who bring fresh ideas from all areas, including information retrieval, distributed computing, large-scale system design, networking and data storage, security, artificial intelligence, natural language processing, UI design and mobile; the list goes on and is growing every day. As a software engineer, you will work on a specific project critical to Google\u2019s needs with opportunities to switch teams and projects as you and our fast-paced business grow and evolve. We need our engineers to be versatile, display leadership qualities and be enthusiastic to take on new problems across the full-stack as we continue to push technology forward.</p>\n<p>With your technical expertise, you will manage project priorities, deadlines, and deliverables. You will design, develop, test, deploy, maintain, and enhance software solutions.</p><p><b></b></p>Individual pay is determined by factors including job-related skills, experience, and relevant education or training.  <br><br>US: $174000 - $252000 (USD) + 15% bonus target + equity + benefits<br><br>Learn more about <a href=\"https://www.google.com/about/careers/applications/benefits/\" target=\"_blank\">benefits at Google</a>."], [4, 3, 2], [1786972877, 819000000], [1786972877, 819000000], [1786972877, 889000000], [null, ""], null, null, [null, ""], [null, "<ul>\n<li>Bachelor's degree or equivalent practical experience.</li>\n<li>5 years of experience in object-oriented programming with Java, C++, or Python.</li>\n<li>3 years of experience testing, maintaining, or launching software products.</li>\n<li>1 year of experience with software design and architecture.</li>\n</ul>"], 2]], null, 1619, 20]});
