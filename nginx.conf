events {}
http {
  server {
    listen 80;
    # Supabase client requests /rest/v1/... -> proxy to PostgREST /
    location /rest/v1/ {
      proxy_pass http://postgrest:3000/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
    # Also handle /rest/v1 without trailing slash
    location = /rest/v1 {
      proxy_pass http://postgrest:3000/;
    }
    location / {
      proxy_pass http://postgrest:3000/;
    }
  }
}
